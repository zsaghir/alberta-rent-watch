[project]
name = "alberta-rent-watch"
version = "0.1.0"
description = "Analyze and forecast Edmonton rental-market conditions using public CMHC and Statistics Canada data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "zsaghir", email = "zsaghir@ualberta.ca" }
]
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.7.0",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "polars>=1.36.1",
    "scikit-learn>=1.6.1",
    "streamlit>=1.50.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "pytest>=8.4.2",
    "ruff>=0.16.3",
]
